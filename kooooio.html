<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>المخطط التفاعلي – فيزياء الثالث المتوسط</title>
<style>
:root{
  --bg:#f6f4ef; --ink:#1f2433; --muted:#6b7082; --line:#c9c4b8; --card:#fff;
  --ch1:#2563c9; --ch1-soft:#e3ecfb; --ch2:#c2410c; --ch2-soft:#fbe9df;
  --def:#15803d; --law:#7c3aed; --ex:#d97706; --act:#0e7490; --app:#0891b2;
  --note:#ca8a04; --enr:#64748b; --q:#475569; --concept:#0f766e; --warn:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif}
header{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 14px;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid #e4dfd3}
header h1{font-size:17px;margin:0;white-space:nowrap}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.search{position:relative;flex:1;min-width:170px;max-width:340px}
.search input{width:100%;padding:8px 12px;border:1px solid #d6d0c2;border-radius:10px;font:inherit;font-size:14px;background:#fff}
#results{position:absolute;top:110%;inset-inline:0;background:#fff;border:1px solid #ddd;border-radius:10px;max-height:50vh;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#results button{display:block;width:100%;text-align:right;border:0;background:none;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid #f0ede6}
#results button:hover{background:#f5f1e8}
#results small{color:var(--muted);display:block;font-size:11px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid #d6d0c2;background:#fff;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3efe5}.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#legend{position:fixed;bottom:12px;right:12px;z-index:15;background:rgba(255,255,255,.95);border:1px solid #e4dfd3;border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;max-width:min(560px,calc(100vw - 24px))}
#legend .lg{display:flex;align-items:center;gap:5px;font-size:12px;border:1px solid transparent;border-radius:8px;padding:3px 7px;cursor:pointer;background:none;font-family:inherit;color:var(--ink)}
#legend .lg.on{border-color:var(--ink);background:#f3efe5}
#legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
#legend .hint{width:100%;font-size:11px;color:var(--muted)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--line);stroke-width:2}
.xlink{fill:none;stroke:#8b5cf6;stroke-width:1.8;stroke-dasharray:6 5;opacity:.75}
.xlink.hot{stroke:#e11d48;opacity:1;stroke-width:2.4}
.node{position:absolute;width:190px;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid #ddd;border-inline-start:5px solid var(--c,#999);
  border-radius:10px;padding:6px 9px;font-size:13px;line-height:1.35;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);
  user-select:none;transition:box-shadow .15s,opacity .2s,outline-color .2s;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.node:hover{box-shadow:0 4px 14px rgba(0,0,0,.13)}
.node .k{display:block;font-size:10px;color:var(--c);font-weight:700;letter-spacing:.2px}
.node .tt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node.sel{outline:3px solid var(--c);outline-offset:2px}
.node.dim{opacity:.22}
.node.match{box-shadow:0 0 0 3px #facc15}
.node.root{width:230px;text-align:center;background:var(--ink);color:#fff;border:0;font-size:16px;font-weight:700;padding:14px}
.node.chapter{width:200px;color:#fff;background:var(--c);border:0;font-weight:700;font-size:15px;padding:10px 12px}
.node.chapter .k{color:rgba(255,255,255,.85)}
.node.lesson{background:var(--soft);font-weight:600}
.node.enrich{border-style:dashed;border-inline-start-style:solid;background:#fafafa}
.node .flag{color:var(--warn);font-size:11px;font-weight:700}
.tg{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:1.5px solid var(--c,#888);background:#fff;color:var(--c,#555);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
.tg.r{right:-13px}.tg.l{left:-13px}
.node.chapter .tg,.node.root .tg{border-color:#fff}
#panel{position:fixed;z-index:30;top:64px;left:12px;bottom:12px;width:min(440px,calc(100vw - 24px));background:#fff;border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(-110%);transition:transform .3s ease}
#panel.open{transform:none}
#panel .ph{padding:14px 16px 10px;border-bottom:1px solid #eee;border-top:6px solid var(--c);border-radius:16px 16px 0 0}
#panel .crumbs{font-size:11px;color:var(--muted);margin-bottom:4px}
#panel .crumbs a{color:inherit;cursor:pointer;text-decoration:underline dotted}
#panel h2{margin:4px 0 0;font-size:19px}
#panel .badge{display:inline-block;font-size:11px;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px}
#panel .x{position:absolute;left:12px;top:14px;border:0;background:#f1efe9;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
#panel .pb{padding:12px 16px 18px;overflow:auto;font-size:15px;line-height:1.85}
#panel .pf{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #eee}
#panel .pf .btn{flex:1}
.pb h4{margin:14px 0 4px;font-size:14px;color:var(--c)}
.pb ul,.pb ol{padding-inline-start:20px;margin:6px 0}
.pb .box{border-radius:10px;padding:8px 12px;margin:10px 0}
.pb .defbox{background:#ecfdf3;border-inline-start:4px solid var(--def)}
.pb .lawbox{background:#f3edff;border-inline-start:4px solid var(--law)}
.pb .notebox{background:#fef9e7;border-inline-start:4px solid var(--note)}
.pb .enrbox{background:#f1f5f9;border:1px dashed var(--enr)}
.pb .warnbox{background:#fef2f2;border-inline-start:4px solid var(--warn);font-size:13px}
.pb table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.pb td,.pb th{border:1px solid #e5e2da;padding:5px 7px;text-align:right;vertical-align:top}
.pb th{background:#f7f5f0}
.eq{direction:ltr;text-align:center;font-family:"Cambria Math","Times New Roman",serif;font-size:21px;margin:10px 0;padding:8px;background:#faf9f6;border-radius:8px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid #ddd;border-inline-start:4px solid var(--c);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{background:#f6f3ec}
.chip small{color:var(--muted)}
.steps li{display:none;margin:4px 0}
.steps li.show{display:list-item;animation:pop2 .3s}
@keyframes pop2{from{opacity:0}}
.stepbtn{margin:4px 0 8px}
.fig{display:block;margin:8px auto;max-width:100%;background:#fcfbf8;border-radius:10px}
@media (max-width:700px){
  .btn{padding:6px 8px;font-size:12px}
  header{gap:6px;padding:8px 10px}
  header h1{font-size:15px}
  header h1 small{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:68vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
  #panel .ph{border-radius:18px 18px 0 0}
  #legend{display:none}
  #legend.show{display:flex;bottom:auto;top:110px}
}
@media (min-width:701px){#lgBtn{display:none}}
</style>
</head>
<body>
<header>
  <h1>المخطط التفاعلي لمادة الفيزياء<small>الثالث المتوسط – الفصل الأول (الكهربائية الساكنة) والفصل الثاني (المغناطيسية)</small></h1>
  <div class="search"><input id="q" type="search" placeholder="ابحث عن مفهوم أو قانون… مثل: كولوم"><div id="results"></div></div>
  <div class="tools">
    <button class="btn" data-lvl="1" title="إظهار الفصلين فقط">الفصول</button>
    <button class="btn" data-lvl="2" title="إظهار الدروس">الدروس</button>
    <button class="btn" data-lvl="9" title="فتح كل الفروع">الكل</button>
    <button class="btn" id="xl" title="إظهار الروابط بين المفاهيم">🔗 الروابط</button>
    <button class="btn" id="zin" aria-label="تكبير">＋</button>
    <button class="btn" id="zout" aria-label="تصغير">－</button>
    <button class="btn" id="fit" title="ملاءمة الشاشة">⤢</button>
    <button class="btn" id="lgBtn">الألوان</button>
  </div>
</header>
<div id="stage"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>
<div id="legend"></div>
<aside id="panel" aria-live="polite">
  <div class="ph"><button class="x" id="close" aria-label="إغلاق">×</button><div class="crumbs" id="crumbs"></div><span class="badge" id="badge"></span><h2 id="ptitle"></h2></div>
  <div class="pb" id="pbody"></div>
  <div class="pf"><button class="btn" id="prev">→ السابق</button><button class="btn" id="next">التالي ←</button></div>
</aside>

<script>
/* ===================== أدوات صياغة ===================== */
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const eq=s=>`<div class="eq">${s}</div>`;
const L=s=>`<span class="ltr">${s}</span>`;
const p10=(m,e)=>`${m}×10<sup>${e}</sup>`;
const steps=arr=>`<button class="btn stepbtn">أظهر الخطوة التالية</button><ol class="steps">${arr.map(s=>`<li>${s}</li>`).join('')}</ol>`;
const box=(cls,h)=>`<div class="box ${cls}">${h}</div>`;
const warn=h=>box('warnbox','⚠ <b>يحتاج إلى مراجعة:</b> '+h);

/* ===================== الرسوم ===================== */
const FIG={
atom:`<svg class="fig" viewBox="0 0 260 170" width="260"><ellipse cx="130" cy="85" rx="110" ry="55" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/><ellipse cx="130" cy="85" rx="60" ry="30" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
<circle cx="122" cy="80" r="12" fill="#ef4444"/><text x="122" y="84" font-size="11" fill="#fff" text-anchor="middle">p+</text><circle cx="138" cy="90" r="12" fill="#9ca3af"/><text x="138" y="94" font-size="11" fill="#fff" text-anchor="middle">n</text>
<circle cx="240" cy="85" r="9" fill="#2563eb"/><text x="240" y="89" font-size="10" fill="#fff" text-anchor="middle">e-</text><circle cx="70" cy="85" r="9" fill="#2563eb"/><text x="70" y="89" font-size="10" fill="#fff" text-anchor="middle">e-</text>
<text x="130" y="160" font-size="12" text-anchor="middle" fill="#334">النواة: بروتونات (+) ونيوترونات (متعادلة)</text></svg>`,
scope:`<svg class="fig" viewBox="0 0 220 220" width="200"><rect x="40" y="70" width="140" height="130" rx="8" fill="#e0f2fe" stroke="#64748b"/><rect x="85" y="62" width="50" height="14" rx="4" fill="#a16207"/>
<line x1="110" y1="30" x2="110" y2="130" stroke="#475569" stroke-width="5"/><ellipse cx="110" cy="28" rx="30" ry="7" fill="#64748b"/>
<path d="M110 130 L92 172" stroke="#d4a017" stroke-width="5"/><path d="M110 130 L128 172" stroke="#d4a017" stroke-width="5"/>
<text x="170" y="24" font-size="11" fill="#334">القرص</text><text x="150" y="105" font-size="11" fill="#334">الساق</text><text x="140" y="180" font-size="11" fill="#334">الورقتان</text><text x="140" y="60" font-size="10" fill="#334">سداد عازل</text></svg>`,
uniform:`<svg class="fig" viewBox="0 0 260 150" width="260"><rect x="20" y="20" width="12" height="110" fill="#ef4444"/><rect x="228" y="20" width="12" height="110" fill="#2563eb"/>
${[35,57,79,101,123].map(y=>`<line x1="34" y1="${y}" x2="222" y2="${y}" stroke="#334" stroke-width="1.5"/><path d="M128 ${y-5} L138 ${y} L128 ${y+5}" fill="#334"/>`).join('')}
<text x="26" y="146" font-size="12" text-anchor="middle">+</text><text x="234" y="146" font-size="12" text-anchor="middle">−</text></svg>`,
efield:`<svg class="fig" viewBox="0 0 300 140" width="300">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return `<line x1="${75+18*c}" y1="${70+18*s}" x2="${75+55*c}" y2="${70+55*s}" stroke="#334"/><circle cx="${75+55*c}" cy="${70+55*s}" r="2.5" fill="#334"/><line x1="${225+55*c}" y1="${70+55*s}" x2="${225+18*c}" y2="${70+18*s}" stroke="#334"/><circle cx="${225+20*c}" cy="${70+20*s}" r="2.5" fill="#334"/>`}).join('')}
<circle cx="75" cy="70" r="15" fill="#ef4444"/><text x="75" y="75" fill="#fff" text-anchor="middle" font-size="15">+</text><circle cx="225" cy="70" r="15" fill="#2563eb"/><text x="225" y="75" fill="#fff" text-anchor="middle" font-size="15">−</text>
<text x="150" y="136" font-size="11" text-anchor="middle" fill="#555">الخطوط تخرج من الموجبة وتدخل في السالبة</text></svg>`,
magnet:`<svg class="fig" viewBox="0 0 300 170" width="300">${[25,45,65].map(h=>`<path d="M220 85 C 240 ${85-h*1.6}, 60 ${85-h*1.6}, 80 85" fill="none" stroke="#334"/><path d="M220 85 C 240 ${85+h*1.6}, 60 ${85+h*1.6}, 80 85" fill="none" stroke="#334"/>`).join('')}
<rect x="80" y="70" width="70" height="30" fill="#dc2626"/><rect x="150" y="70" width="70" height="30" fill="#2563eb"/><text x="115" y="91" fill="#fff" text-anchor="middle" font-size="15">S</text><text x="185" y="91" fill="#fff" text-anchor="middle" font-size="15">N</text>
<path d="M146 34 l8 -4 l-8 -4" fill="none" stroke="#334" stroke-width="2" transform="rotate(180 150 30)"/>
<text x="150" y="164" font-size="11" text-anchor="middle" fill="#555">خارج المغناطيس: من N إلى S، وتكمل دورتها داخله</text></svg>`
};

/* ===================== المحتوى (مأخوذ من الكتاب المرفق) ===================== */
const TYPES={
 root:{n:'المنهج',c:'#1f2433'}, chapter:{n:'فصل',c:'#2563c9'}, lesson:{n:'درس',c:'#2563c9'},
 concept:{n:'مفهوم',c:'#0f766e'}, def:{n:'تعريف',c:'#15803d'}, law:{n:'قانون',c:'#7c3aed'},
 ex:{n:'مثال محلول',c:'#d97706'}, act:{n:'نشاط / تجربة',c:'#0e7490'}, app:{n:'تطبيق',c:'#0891b2'},
 note:{n:'تذكّر / ملاحظة',c:'#ca8a04'}, enrich:{n:'إثرائي (للاطلاع)',c:'#64748b'}, q:{n:'أسئلة ومسائل',c:'#475569'}
};
let _id=0;
function N(type,t,body,kids,o={}){return Object.assign({id:'n'+(++_id),type,t,body:body||'',kids:kids||[]},o)}

const DATA=N('root','فيزياء الثالث المتوسط',
`<p>هذا المخطط مبني على الملف المرفق، وهو 40 صفحة (صفحات الكتاب 7–46): <b>الفصل الأول (الكهربائية الساكنة)</b> و<b>الفصل الثاني (المغناطيسية)</b>.</p>
<h4>طريقة الاستعمال</h4><ul><li>اضغط أي عقدة لترى شرحها الكامل هنا.</li><li>الزر الدائري بجانب العقدة يطوي فروعها أو يفتحها.</li><li>اسحب للتحريك، واستعمل العجلة أو إصبعين للتكبير والتصغير.</li><li>زر 🔗 يُظهر الروابط بين المفاهيم المتشابهة في الفصلين.</li></ul>
${warn('صفحات الكتاب قبل الصفحة 7 غير موجودة في الملف (غلاف الفصل الأول، ومفرداته، وأهدافه، وصفحة 4 التي يحيل إليها الكتاب لشرح ضرب الأسس وقسمتها). كذلك يذكر النص الصور ولا تظهر في المخطط إلا رسوم تبسيطية.')}`,[
/* ---------------- الفصل الأول ---------------- */
N('chapter','الفصل الأول: الكهربائية الساكنة',
`<p>يدرس الفصل الشحنات الكهربائية الساكنة: نشأتها، وأنواعها، وطرائق الشحن، والكشاف الكهربائي، والتطبيقات، والموصلات والعوازل، وقانون كولوم، والمجال الكهربائي.</p>
<p>الصفحات 7–30 من الكتاب.</p>${warn('صفحة غلاف الفصل الأول ومفرداته وأهدافه غير موجودة في الملف؛ ترقيم الدروس (1-1 … 1-9) مأخوذ من متن الصفحات.')}`,[
 N('lesson','مقدمة: أصل كلمة الكهربائية',
 `<p>وجد الحكيم الإغريقي أرسطو طاليس (عام 600 ق.م) أن مادة <b>الكهرب</b> عند دلكها بقطعة من الصوف تصير لها القابلية على جذب الأجسام الخفيفة (مثل قصاصات الورق وقطع القش).</p>
<p>وبعده وجد العالم الإنكليزي <b>وليم كلبرت</b> (عام 1600م) أن كثيراً من المواد تشارك الكهرب في هذه الخاصية، لذا أطلق عليها اسم «الكهربائية».</p>
<p>وهي عند الإغريق مشتقة من كلمة ${L('Electron')} التي أطلق عليها «الكهرمان ${L('Amber')}».</p>`,[],{sec:'مقدمة'}),

 N('lesson','الكهربائية الساكنة','<p>ظواهر يومية تبيّن أن الأجسام تُشحن بالدلك، ثم تُفرَّغ شحنتها أحياناً بشكل صعقة طفيفة أو شرارة.</p>',[
  N('concept','ملاحظات من الحياة اليومية',
  `<ul><li>انجذاب قصاصات الورق إلى <b>مشط بلاستيكي</b> بعد دلكه بالشعر (والشعر جاف وبدون زيت)، لأن المشط المدلوك يصير مشحوناً بالشحنات الكهربائية الساكنة. شكل (1)</li>
  <li>انجذاب القصاصات إلى <b>بالون</b> دُلك بقطعة من الصوف. شكل (2)</li>
  <li>البالون المدلوك بالصوف يجذب <b>شعر الرأس</b> الجاف. شكل (3)</li>
  <li>البالون المشحون <b>يلتصق بالجدار</b> لعدة ساعات إذا كان الجو جافاً (لأن الهواء الرطب يساعد على تفريغ الشحنات بسرعة). شكل (4)</li>
  <li>السير على <b>سجادة من الصوف</b> يُكسب الجسم شحنات، فتشعر بصعقة طفيفة عند لمس المقبض المعدني للباب. شكل (5)</li>
  <li>النزول من <b>السيارة</b> ولمس جزء معدني منها يسبب صعقة طفيفة، أو تحدث شرارة صغيرة بين المفتاح والسطح المعدني للسيارة. شكل (6)</li>
  <li>المشط المدلوك يجذب <b>ماء الحنفية</b> المنساب رفيعاً. شكل (7)</li>
  <li>في <b>لعبة التزحلق البلاستيكية</b> تحتك ملابس الطفل بأرضية اللعبة فيكتسب جسمه شحنات، ويشعر بصعقة طفيفة عند لمس عمود معدني. شكل (8)</li></ul>`),
  N('enrich','هل تعلم: البرق',

 N('lesson','الشحنة الكهربائية','<p>المادة تتألف من ذرات، والذرة تحوي إلكترونات سالبة وبروتونات موجبة ونيوترونات متعادلة.</p>'+FIG.atom,[

 N('lesson','تطبيقات عملية للكهربائية الساكنة','<p>تُستثمر الكهربائية الساكنة في عمل عدد من الأجهزة.</p>',[

 N('lesson','قانون كولوم',`<p>${L("Coulomb's law")}: يحدد مقدار القوة الكهربائية المتبادلة بين شحنتين نقطيتين ساكنتين.</p>`,[

  ${box('notebox','قيمة الثابت في الفراغ: '+L('k = 9×10<sup>9</sup> N·m<sup>2</sup>/C<sup>2</sup>'))}
  <h4>متى نستعمله؟</h4><p>لحساب القوة بين شحنتين نقطيتين ساكنتين، أو لإيجاد إحدى الشحنتين أو البعد بينهما إذا عُلمت القوة.</p>

  N('ex','مثال: شحنتان موجبتان (90 N)',

  <p>حاول الحل بنفسك أولاً، ثم أظهر الخطوات:</p>
  ${steps([
   '<b>المعطيات:</b> '+L('q<sub>1</sub> = +4×10<sup>-6</sup> C ، q<sub>2</sub> = +9×10<sup>-6</sup> C ، r = 0.06 m ، k = 9×10<sup>9</sup>'),
   '<b>المطلوب:</b> '+L('F<sub>12</sub>')+' و '+L('F<sub>21</sub>')+' ونوع كل منهما.',

   '<b>التعويض:</b> '+L('F<sub>12</sub> = 9×10<sup>9</sup> × '+fr('(4×10<sup>-6</sup>)(9×10<sup>-6</sup>)','(0.06)<sup>2</sup>')),
   '<b>الحساب:</b> '+L(fr('9×4×9 × 10<sup>9−6−6</sup>','36×10<sup>-4</sup>')+' = '+fr('324×10<sup>-3</sup>','36×10<sup>-4</sup>')+' = 9×10 = 90'),
   '<b>الناتج:</b> '+L('F<sub>12</sub> = 90 N')+'، وبما أن القوة موجبة فهي <b>قوة تنافر</b>.',
   '<b>الجزء الثاني:</b> بالطريقة نفسها '+L('F<sub>21</sub> = 90 N')+' قوة تنافر، و'+L('F<sub>21</sub> = − F<sub>12</sub>')+': متساويتان بالمقدار ومتعاكستان بالاتجاه (القانون الثالث لنيوتن).'])}`)

 N('lesson','المجال الكهربائي',`<p>${L('The electric field')}: تأثير تُحدثه الشحنة في الحيز المحيط بها.</p>`+FIG.efield,[

  ${box('defbox','<b>مقدار المجال الكهربائي</b> في أية نقطة: القوة الكهربائية لوحدة الشحنة المؤثرة في شحنة اختبارية صغيرة موجبة '+L("q′")+' موضوعة في تلك النقطة.')}`),
  N('law','قانون المجال الكهربائي',

  N('concept','خطوط المجال الكهربائي',

  N('def','المجال الكهربائي المنتظم',

  N('ex','مثال: حساب المجال (2×10³ N/C)',

 N('q','أسئلة الفصل الأول ومسائله',
 `<p>أسئلة الكتاب في نهاية الفصل (الصفحات 25–30). اضغط فرعاً لتراه.</p>${warn('السؤالان س5 وس7 يعتمدان على أشكال لا تظهر في المخطط؛ ارجع إلى الكتاب لرؤيتها.')}`,[
  N('q','س1: اختر العبارة الصحيحة (9 فقرات)',
  `<ol><li>الذرة المتعادلة هي ذرة…</li><li>يصير الجسم مشحوناً بشحنة موجبة إذا كانت بعض ذراته تمتلك…</li><li>عند فقدان شحنة ${L('1.6×10<sup>-9</sup> C')} من جسم موصل معزول متعادل، فإن عدد الإلكترونات المفقودة…</li><li>شحنتان موجبتان البعد بينهما ${L('10 cm')}، استُبدلت إحداهما بأخرى سالبة بالمقدار نفسه، فإن مقدار القوة…</li><li>شحنتان (موجبة وسالبة) البعد بينهما ${L('3 cm')} والقوة ${L('F<sub>1</sub>')}، أُبعدتا إلى ${L('6 cm')} فصارت القوة ${L('F<sub>2</sub>')} تساوي…</li><li>بعد السير على سجادة صوف ولمس مقبض الباب تُصاب بصعقة خفيفة، لأن الشحنات…</li><li>الجسم A شحنته ${L('+2 μC')} والجسم B شحنته ${L('+6 μC')}، فالقوة المتبادلة…</li><li>تقريب جسم موجب من قرص كشاف ذي ورقتين مشحون بشحنة موجبة يؤدي إلى…</li><li>تقريب جسم سالب من قرص كشاف متصل بالأرض…</li></ol>

  `<ul><li><b>س2 علّل:</b> (1) تُجهَّز سيارات نقل الوقود بسلاسل معدنية في مؤخرتها تلامس الأرض. (2) تتعادل شحنة الجسم المشحون عند إيصاله بالأرض. (3) يزداد انفراج ورقتي الكشاف المشحون بشحنة سالبة عند تقريب جسم سالب من قرصه.</li>
  <li><b>س3:</b> وضّح كيف تشحن كشافاً بشحنة موجبة باستعمال: (a) ساق زجاج موجبة، (b) ساق مطاط سالبة.</li>
  <li><b>س4:</b> عدّد طرائق شحن الأجسام بالكهربائية الساكنة.</li>
  <li><b>س5:</b> ساق زجاج موجبة وكرة معدنية معزولة متعادلة في ثلاث حالات (a-b-c) — يعتمد على الشكل.</li>
  <li><b>س6:</b> طالب شحن كشافاً بالحث لكنه <b>أبعد الساق قبل أن يرفع إصبعه</b> فوجد الورقتين منطبقتين. ما تفسير ذلك؟</li>
  <li><b>س7:</b> اكتب نوع الشحنة في الأشكال — يعتمد على الأشكال.</li></ul>
  <p>تلميح لـ س6: قارن ترتيب خطواته مع ترتيب الخطوات في نشاط الشحن بالحث.</p>`,[],{links:['n_induction']}),

  ${steps(['<b>المعطيات:</b> '+L('F = 9×10<sup>-7</sup> N ، r = 10 cm = 0.1 m ، q<sub>1</sub> = q<sub>2</sub> = q'),

/* ===================== التهيئة ===================== */
const byId={};const parent={};
const LTRRE=/[A-Za-z0-9][A-Za-z0-9×⁻³²¹⁰⁹⁵.\/ ′=μ]*[A-Za-z0-9³²¹⁰⁹⁵′)]?/g;
(function walk(n,p,depth,ch,side){n.t=n.t.replace(LTRRE,m=>'\u2066'+m.trim()+'\u2069'+(m.endsWith(' ')?' ':''));n.depth=depth;n.ch=n.ch||ch;n.side=side;byId[n.id]=n;if(p)parent[n.id]=p;
 n.kids.forEach((k,i)=>walk(k,n,depth+1,depth===0?(i+1):n.ch,depth===0?(i===0?1:-1):side));})(DATA,null,0,0,0);
// تعديل الأبعاد: الفصل الأول على اليمين والثاني على اليسار
const CHC={1:['var(--ch1)','var(--ch1-soft)','#2563c9'],2:['var(--ch2)','var(--ch2-soft)','#c2410c']};
// روابط ثنائية الاتجاه
Object.values(byId).forEach(n=>(n.links||[]).forEach(l=>{const m=byId[l];if(m){m.links=m.links||[];if(!m.links.includes(n.id))m.links.push(n.id);}}));
const XPAIRS=[];const seen=new Set();
Object.values(byId).forEach(n=>(n.links||[]).forEach(l=>{const k=[n.id,l].sort().join('|');if(!seen.has(k)&&byId[l]){seen.add(k);XPAIRS.push([n.id,l]);}}));

function color(n){if(n.type==='root')return '#1f2433';if(n.type==='chapter'||n.type==='lesson')return CHC[n.ch][2];return TYPES[n.type].c;}
function label(n){if(n.type==='lesson')return 'درس '+(n.sec||'');if(n.type==='chapter')return 'الفصل '+(n.ch===1?'الأول':'الثاني');return TYPES[n.type].n;}

let open=new Set();function setLevel(l){open=new Set();Object.values(byId).forEach(n=>{if(n.depth<l&&n.kids.length)open.add(n.id)});}
setLevel(innerWidth<=700?1:2);

/* ===================== التخطيط ===================== */
const COLW=235, nodesEl=document.getElementById('nodes'), svg=document.getElementById('edges');
let pos={};
const HC={};function rowH(n){return (HC[n.id]||48)+10;}
function layout(){
 pos={};pos[DATA.id]={x:0,y:0};
 [1,-1].forEach(side=>{
  let cur=0;const placed=[];
  function lay(n,d){const x=side*(d*COLW+ (d>0?20:0));
   const vis=open.has(n.id)?n.kids:[];
   if(!vis.length){const h=rowH(n);const y=cur+h/2;cur+=h;pos[n.id]={x,y};placed.push(n.id);return y;}
   const ys=vis.map(k=>lay(k,d+1));const y=(ys[0]+ys[ys.length-1])/2;pos[n.id]={x,y};placed.push(n.id);return y;}
  const ch=DATA.kids[side===1?0:1];
  if(open.has(DATA.id)) lay(ch,1);
  const ys=placed.map(id=>pos[id].y);if(ys.length){const off=-(Math.min(...ys)+Math.max(...ys))/2;placed.forEach(id=>pos[id].y+=off);}
 });
}
function visible(id){let p=parent[id];while(p){if(!open.has(p.id))return false;p=parent[p.id];}return true;}

let selected=null, showX=false, typeFilter=null, matches=new Set();
function render(){
 const ids=[DATA.id];(function add(n){if(open.has(n.id))n.kids.forEach(k=>{ids.push(k.id);add(k);});})(DATA);
 nodesEl.innerHTML='';const els={};
 ids.forEach(id=>{const n=byId[id];
  const d=document.createElement('div');d.className='node '+n.type+(id===selected?' sel':'')+(matches.has(id)?' match':'');
  if(typeFilter&&n.type!==typeFilter&&n.type!=='root'&&n.type!=='chapter')d.classList.add('dim');
  d.style.setProperty('--c',color(n));
  if(n.type==='lesson')d.style.setProperty('--soft',CHC[n.ch][1]);
  d.dataset.id=id;
  const flag=n.body.includes('warnbox')?' <span class="flag" title="فيه ملاحظة تحتاج مراجعة">⚠</span>':'';
  d.innerHTML=(n.type!=='root'?`<span class="k">${label(n)}${flag}</span>`:'')+`<span class="tt">${n.t}</span>`;
  if(n.kids.length&&n.type!=='root'){const b=document.createElement('button');b.className='tg '+(n.side===1?'r':'l');
   b.textContent=open.has(id)?'−':n.kids.length;b.title=open.has(id)?'طي الفروع':'فتح الفروع ('+n.kids.length+')';b.dataset.tg=id;d.appendChild(b);}
  nodesEl.appendChild(d);els[id]=d;});
 ids.forEach(id=>{if(!HC[id])HC[id]=els[id].offsetHeight;});
 layout();
 ids.forEach(id=>{const p=pos[id];els[id].style.left=p.x+'px';els[id].style.top=p.y+'px';});
 drawEdges();
}
function W(n){return n.type==='root'?230:n.type==='chapter'?200:190;}
function drawEdges(){
 let h='';
 Object.keys(pos).forEach(id=>{const p=parent[id];if(!p||!pos[p.id])return;const n=byId[id];
  const a=pos[p.id],b=pos[id],s=n.side;
  const x1=a.x+s*W(p)/2,x2=b.x-s*W(n)/2,mx=(x1+x2)/2;
  h+=`<path class="edge" style="stroke:${n.depth<=2?color(n):''}" d="M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}"/>`;});
 XPAIRS.forEach(([u,v])=>{const hot=selected&&(u===selected||v===selected);if(!(showX||hot))return;if(!pos[u]||!pos[v])return;
  const a=pos[u],b=pos[v];const dx=b.x-a.x;const cy=Math.min(a.y,b.y)-60-Math.abs(dx)*0.15;
  h+=`<path class="xlink${hot?' hot':''}" d="M${a.x},${a.y} Q${(a.x+b.x)/2},${cy} ${b.x},${b.y}"/>`;});
 svg.innerHTML=h;
}

/* ===================== التحريك والتكبير ===================== */
const stage=document.getElementById('stage'),world=document.getElementById('world');
let T={x:innerWidth/2,y:innerHeight/2+30,s:.8};
function apply(anim){world.classList.toggle('anim',!!anim);world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.s})`;}
function zoomAt(f,cx,cy){const ns=Math.min(2.5,Math.max(.15,T.s*f));T.x=cx-(cx-T.x)*ns/T.s;T.y=cy-(cy-T.y)*ns/T.s;T.s=ns;apply();}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY);},{passive:false});
const ptrs=new Map();let moved=0,last=null,pinch=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#panel'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;last={x:e.clientX,y:e.clientY};
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:T.s};}stage.classList.add('drag');});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.s*d/pinch.d/T.s,(a.x+b.x)/2,(a.y+b.y)/2);moved=99;return;}
 const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);T.x+=dx;T.y+=dy;last={x:e.clientX,y:e.clientY};apply();});
addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===1){last=[...ptrs.values()][0];}if(!ptrs.size)stage.classList.remove('drag');});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;});

stage.addEventListener('click',e=>{if(moved>6)return;
 const tg=e.target.closest('[data-tg]');if(tg){const id=tg.dataset.tg;open.has(id)?open.delete(id):open.add(id);render();return;}
 const nd=e.target.closest('.node');if(nd){select(nd.dataset.id,false);}});

function fit(){layout();const xs=[],ys=[];Object.keys(pos).forEach(id=>{const p=pos[id],w=W(byId[id])/2;xs.push(p.x-w,p.x+w);ys.push(p.y-40,p.y+40);});
 const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
 const top=document.querySelector('header').offsetHeight+10,vw=innerWidth-30,vh=innerHeight-top-20;
 T.s=Math.min(1.1,Math.max(.15,Math.min(vw/(maxx-minx),vh/(maxy-miny))));T.x=innerWidth/2-(minx+maxx)/2*T.s;T.y=top+vh/2-(miny+maxy)/2*T.s;apply(true);}
function centerOn(id){const p=pos[id];if(!p)return;const panelOpen=document.getElementById('panel').classList.contains('open');
 const mob=innerWidth<=700;const cx=mob?innerWidth/2:(panelOpen?(innerWidth+460)/2:innerWidth/2);const cy=mob?innerHeight*.2:innerHeight/2;
 if(T.s<.6)T.s=.75;T.x=cx-p.x*T.s;T.y=cy-p.y*T.s;apply(true);}

/* ===================== اللوحة ===================== */
const panel=document.getElementById('panel');
function siblings(id){const p=parent[id];return p?p.kids:[byId[id]];}
function select(id,center=true){
 const n=byId[id];selected=id;
 let p=parent[id];while(p){open.add(p.id);p=parent[p.id];}
 if(n.kids.length)open.add(id);
 render();
 const c=color(n);panel.style.setProperty('--c',c);
 document.getElementById('badge').textContent=label(n);
 document.getElementById('ptitle').textContent=n.t;
 const path=[];p=parent[id];while(p){path.unshift(p);p=parent[p.id];}
 document.getElementById('crumbs').innerHTML=path.map(x=>`<a data-go="${x.id}">${x.t}</a>`).join(' › ');
 let h=n.body;
 if(n.kids.length)h+=`<h4>فروع هذه العقدة</h4><div class="chips">${n.kids.map(k=>`<button class="chip" style="--c:${color(k)}" data-go="${k.id}">${k.t} <small>· ${label(k)}</small></button>`).join('')}</div>`;
 if(n.links&&n.links.length)h+=`<h4>🔗 مرتبط بـ</h4><div class="chips">${n.links.map(l=>byId[l]).map(k=>`<button class="chip" style="--c:${color(k)}" data-go="${k.id}">${k.t} <small>· ${k.ch===1?'الفصل الأول':'الفصل الثاني'}</small></button>`).join('')}</div>`;
 const pb=document.getElementById('pbody');pb.innerHTML=h;pb.scrollTop=0;
 pb.querySelectorAll('.stepbtn').forEach(b=>{const ol=b.nextElementSibling;const lis=[...ol.children];
  b.onclick=()=>{const nx=lis.find(li=>!li.classList.contains('show'));if(nx)nx.classList.add('show');if(lis.every(li=>li.classList.contains('show'))){b.textContent='إخفاء الحل';b.onclick=()=>{lis.forEach(li=>li.classList.remove('show'));b.textContent='أظهر الخطوة التالية';select(id,false);}}};});
 const sib=siblings(id),i=sib.indexOf(n);
 const pv=document.getElementById('prev'),nx=document.getElementById('next');
 pv.disabled=i<=0;nx.disabled=i>=sib.length-1;pv.onclick=()=>select(sib[i-1].id);nx.onclick=()=>select(sib[i+1].id);
 panel.classList.add('open');
 if(center)setTimeout(()=>centerOn(id),20);
}
panel.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)select(g.dataset.go);});
document.getElementById('close').onclick=()=>{panel.classList.remove('open');selected=null;render();};
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('close').click();});

/* ===================== الأزرار ===================== */
document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lvl);if(selected){let p=parent[selected];while(p){open.add(p.id);p=parent[p.id];}}render();fit();});
document.getElementById('xl').onclick=e=>{showX=!showX;e.currentTarget.classList.toggle('on',showX);if(showX){XPAIRS.forEach(pr=>pr.forEach(id=>{let p=parent[id];while(p){open.add(p.id);p=parent[p.id];}}));render();fit();}else drawEdges();};
document.getElementById('zin').onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);
document.getElementById('fit').onclick=fit;
document.getElementById('lgBtn').onclick=()=>document.getElementById('legend').classList.toggle('show');

const lg=document.getElementById('legend');
lg.innerHTML=Object.entries(TYPES).filter(([k])=>!['root','chapter','lesson'].includes(k)).map(([k,v])=>`<button class="lg" data-t="${k}"><i style="background:${v.c}"></i>${v.n}</button>`).join('')
 +`<button class="lg" disabled><i style="background:var(--ch1)"></i>الفصل الأول</button><button class="lg" disabled><i style="background:var(--ch2)"></i>الفصل الثاني</button><span class="hint">اضغط نوعاً لتمييزه في المخطط (افتح «الكل» لرؤية جميع العقد)</span>`;
lg.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;typeFilter=typeFilter===b.dataset.t?null:b.dataset.t;
 lg.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===typeFilter));render();});

/* ===================== البحث ===================== */
const norm=s=>s.replace(/<[^>]+>/g,' ').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const IDX=Object.values(byId).map(n=>({n,t:norm(n.t.replace(/[\u2066\u2069]/g,'')),b:norm(n.body)}));
const qi=document.getElementById('q'),res=document.getElementById('results');
qi.addEventListener('input',()=>{const q=norm(qi.value.trim());matches=new Set();
 if(q.length<2){res.style.display='none';render();return;}
 const hits=IDX.filter(x=>x.t.includes(q)||x.b.includes(q)).sort((a,b)=>(b.t.includes(q))-(a.t.includes(q))).slice(0,30);
 hits.forEach(h=>{matches.add(h.n.id);let p=parent[h.n.id];while(p){open.add(p.id);p=parent[p.id];}});
 res.innerHTML=hits.length?hits.map(h=>`<button data-go="${h.n.id}">${h.n.t}<small>${label(h.n)} · ${h.n.ch===1?'الفصل الأول':h.n.ch===2?'الفصل الثاني':''}</small></button>`).join(''):'<button disabled>لا توجد نتائج</button>';
 res.style.display='block';render();});
res.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){res.style.display='none';select(g.dataset.go);}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.style.display='none';});

render();fit();
</script>
</body>
</html>
